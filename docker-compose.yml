services:
  backend:
    build:
      context: ../Tubes2_PengenLibur_BE
      dockerfile: Dockerfile
    environment:
      PORT: "8080"
      CORS_ALLOWED_ORIGIN: "http://localhost"
    expose:
      - "8080"
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      BACKEND_ORIGIN: "http://backend:8080"
      PORT: "3000"
    expose:
      - "3000"
    depends_on:
      - backend
    restart: unless-stopped

  proxy:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - backend
    restart: unless-stopped
